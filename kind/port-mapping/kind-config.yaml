kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: control-plane
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30000
        hostPort: 8080
        listenAddress: "0.0.0.0" # Optional, defaults to "0.0.0.0"
        # protocol: udp # Optional, defaults to tcp
  - role: worker
  - role: worker
